version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: devpulse-postgres
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse
      POSTGRES_DB: devpulse
    ports:
      - "5432:5432"
    volumes:
      - devpulse-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: devpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - devpulse-redis:/data

volumes:
  devpulse-postgres:
  devpulse-redis:
